name: CI-develop

on:
  push:
    branches-ignore:
      - main
  pull_request:

jobs:
  prepare:
    runs-on: ubuntu-latest
    if: "! contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - run: echo "${{ github.event.head_commit.message }}"
  lint:
    name: Run static checker
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v3
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.13"
      - name: Install poethepoet
        run: uv tool install poethepoet
      - name: Install dependencies
        run: uv sync --locked
      - name: Run linter
        run: poe lint
      - name: Check types
        run: poe type-check
  test:
    name: Run test
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v3
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install poethepoet
        run: uv tool install poethepoet
      - name: Install dependencies
        run: |
          uv sync --locked
          [[ $(uv run python --version) =~ ${{ matrix.python-version }}\.* ]]
      - name: Run tests
        run: poe test
