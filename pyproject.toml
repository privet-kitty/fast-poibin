[project]
name = "fast-poibin"
version = "0.4.0"
description = "Package for computing PMF and CDF of Poisson binomial distribution."
authors = [{ name = "Hugo Sansaqua", email = "privet.kitty99@gmail.com" }]
license = "MPL-2.0"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numba>=0.57,<0.58; python_version < '3.12'",
    "numba>=0.59,<0.60; python_version == '3.12'",
    "numba>=0.61,<0.62; python_version >= '3.13'",
    "numpy>=1.23",
]

[project.urls]
Repository = "https://github.com/privet-kitty/fast-poibin"
Documentation = "https://privet-kitty.github.io/fast-poibin/"

[dependency-groups]
dev = [
    "mypy>=1.4.1,<2",
    "flake8>=5.0.4,<6",
    "black>=22.12.0,<23",
    "isort>=5.11.4,<6",
    "poethepoet>=0.17.1,<0.18",
    "pytest>=7.2.0,<8",
    "pytest-cov>=4.0.0,<5",
    "coverage[toml]>=7.0.3,<8",
    "pytest-mock>=3.10.0,<4",
    "sphinx-rtd-theme==1.2.0rc2",
    "sphinx>=6.1.2,<7",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.mypy]
strict = true
follow_imports = "silent"
ignore_missing_imports = true
python_version = "3.13"
show_column_numbers = true

[tool.black]
line-length = 100
exclude = '''
(
    .venv
    | .mypy_cache
    | .pytest_cache
    | .tox
)
'''

[tool.isort]
include_trailing_comma = true
line_length = 100
multi_line_output = 3
use_parentheses = true
ensure_newline_before_comments = true
force_grid_wrap = 0

[tool.coverage.report]
exclude_lines = ["if __name__ == .__main__.:"]

[tool.poe.tasks]
lint = "flake8 fast_poibin tests"
test = "pytest --cov=fast_poibin"
type-check = "mypy fast_poibin tests"
docs = "sphinx-build docs docs/_build"
